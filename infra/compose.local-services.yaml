services:
  renderer:
    environment:
      PYTHONPATH: /app
    volumes:
      - ../apps/api/src/text_verification:/app/text_verification:ro
    command:
      ["uvicorn", "text_verification.preview_renderer:app", "--host", "0.0.0.0", "--port", "8000",
       "--reload", "--reload-dir", "/app/text_verification"]

  renderer-gateway:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "127.0.0.1:8010:8080"
    volumes:
      - ./renderer-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      renderer:
        condition: service_healthy
    networks: [default, rendering]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
