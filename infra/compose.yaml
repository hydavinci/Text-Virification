name: text-verification

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://text_verification:text_verification@postgres:5432/text_verification
  REDIS_URL: redis://redis:6379/0
  STORAGE_ROOT: /var/lib/text-verification/jobs
  PREVIEW_RENDERER_URL: http://renderer:8000

x-backend-service: &backend-service
  build:
    context: ../apps/api
    target: runtime
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
  image: ${BACKEND_IMAGE:-text-verification-backend:development}
  env_file:
    - ../.env
  environment: *backend-environment
  # APP_ENV 为 production/staging/deployed 时，.env 必须提供至少 32 字节的
  # RECHECK_GRANT_SECRET；API 与 Worker 会在启动时 fail closed。

services:
  renderer:
    build:
      context: ../apps/api
      target: runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    image: ${BACKEND_IMAGE:-text-verification-backend:development}
    command:
      ["uvicorn", "text_verification.preview_renderer:app", "--host", "0.0.0.0", "--port", "8000"]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [rendering]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: text_verification
      POSTGRES_USER: text_verification
      POSTGRES_PASSWORD: text_verification
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U text_verification -d text_verification"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *backend-service
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-service
    command: ["uvicorn", "text_verification.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    networks: [default, rendering]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      renderer:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - job-data:/var/lib/text-verification/jobs

  worker:
    <<: *backend-service
    command: ["text-verification-worker"]
    restart: unless-stopped
    environment:
      <<: *backend-environment
      TEXT_VERIFICATION_WORKER_ROLE: verification
      TEXT_VERIFICATION_WORKER_QUEUES: celery,verification-v2
      TEXT_VERIFICATION_WORKER_CONCURRENCY: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - job-data:/var/lib/text-verification/jobs

  maintenance-worker:
    <<: *backend-service
    command: ["text-verification-worker"]
    restart: unless-stopped
    environment:
      <<: *backend-environment
      TEXT_VERIFICATION_WORKER_ROLE: maintenance
      TEXT_VERIFICATION_WORKER_QUEUES: maintenance-v2
      TEXT_VERIFICATION_WORKER_CONCURRENCY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - job-data:/var/lib/text-verification/jobs

  beat:
    <<: *backend-service
    command:
      [
        "celery",
        "-A",
        "text_verification.workers.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/var/lib/text-verification/jobs/celerybeat-schedule",
      ]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - job-data:/var/lib/text-verification/jobs

  web:
    build:
      context: ../apps/web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    image: ${WEB_IMAGE:-text-verification-web:development}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres-data:
  job-data:

networks:
  rendering:
    internal: true
