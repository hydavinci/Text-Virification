server {
    listen 8080;
    server_name _;
    client_max_body_size 64m;
    location / {
        proxy_pass http://renderer:8000;
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
