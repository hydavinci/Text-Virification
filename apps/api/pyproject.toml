[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-verification"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "ijson>=3.3,<4",
  "openai>=1.60,<2",
  "pdfplumber>=0.11,<1",
  "psycopg[binary]>=3.2,<4",
  "pymupdf>=1.25,<2",
  "pydantic-settings>=2.7,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
text-verification-worker = "text_verification.workers.worker_cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
ocr = [
  "numpy>=2,<3",
  "onnxruntime>=1.20,<2",
  "opencv-python-headless>=4.10,<5",
  "rapidocr>=3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"text_verification.resources" = ["dictionaries/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
